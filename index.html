<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Z4 Exchange</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background-color: #0f172a;
      font-weight: bold;
      font-size: 20px;
    }

    .container {
      padding: 80px 20px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 30px;
      min-width: 250px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2563eb;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<header>Z4 Exchange</header>

<div class="container">
  <h1>Digital Asset Platform</h1>
  <p>Manage and acquire domains using Z4lings.</p>

  <div class="card">
    <h2>Balance</h2>
    <p>10,000 Z4lings</p>
    <button>View Marketplace</button>
  </div>
</div>

</body>
</html>
