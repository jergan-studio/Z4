<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Z4 Exchange</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: white;
    }

    header {
      padding: 20px 40px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 2px;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #9ca3af;
      font-size: 18px;
    }

    .btn {
      margin-top: 25px;
      padding: 12px 24px;
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      margin: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .dashboard {
      display: flex;
      justify-content: center;
      margin-top: 40px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Z4 Exchange</div>
  <div>Secure Asset Simulation</div>
</header>

<section class="hero">
  <h1>Welcome to Z4</h1>
  <p>A next-generation digital asset environment powered by Z4lings.</p>
  <button class="btn">Access Platform</button>
</section>

<section class="dashboard">
  <div class="card">
    <h2>Balance</h2>
    <p>10,000 Z4lings</p>
  </div>
  <div class="card">
    <h2>Domains Owned</h2>
    <p>3</p>
  </div>
</section>

</body>
</html>
